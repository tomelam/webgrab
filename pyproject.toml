[project]
name = "webgrab"
version = "0.1.0"
description = "Shared web-wrangling layer: fetching, freshness, parsing, and a checked registry of endpoints."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "requests>=2.32,<3",
    "tenacity>=8,<10",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
browser = ["playwright>=1.40", "playwright-stealth>=2"]
dev = ["pytest>=8", "responses>=0.25"]

[project.entry-points.pytest11]
webgrab = "webgrab.testing"

[project.scripts]
webgrab = "webgrab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: hits a live site; opt in with -m network",
]
