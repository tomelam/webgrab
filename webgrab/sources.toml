read the total-records field to know when to stop. Throttle between pages.
m.rbi.org.in/Scripts/BS_SwarnaBharat.aspx is CAPTCHA-walled -- use the
press-release path instead. Reference: PortfolioAnalyzer loaders/sgb_redemptions.py.
"""

